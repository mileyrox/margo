kind = "web"
previewPath = "/"
title = "Margo"
description = "Margo is your money friend: understand your spending and find cheaper alternatives to products you already buy."
version = "1.0.0"
id = "artifacts/aliena-money"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19610

[services.development]
run = "pnpm --filter @workspace/aliena-money run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/aliena-money", "run", "build" ]
serve = "static"
publicDir = "artifacts/aliena-money/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19610"
BASE_PATH = "/"
